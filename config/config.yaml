# ---------------------------------------------------------------------------
# Freight Rate Prediction — project configuration
#
# Every value the pipeline depends on lives here, so nothing has to be changed
# in code to rerun an experiment. Paths are relative to the project root.
# ---------------------------------------------------------------------------

project:
  name: freight-rate-prediction
  random_seed: 42
  target: posted_rate

# --- Files -----------------------------------------------------------------
# The first four are provided by the assessment and must not move: score.py
# reads validation_predictions.csv from the root and the December file from data/.
paths:
  train: data/train-test.csv
  validation: data/validation.csv
  december: data/december_chart_inputs.csv
  submission_template: data/validation-predictions-template.csv

  # Intermediate artifacts written by the pipeline.
  preprocessed_dir: data/02-preprocessed
  features_dir: data/03-features
  predictions_dir: data/04-predictions

  # Trained model and its metadata.
  model_dir: models
  model_file: models/model.pkl
  metadata_file: models/metadata.json

  # Deliverables.
  submission: validation_predictions.csv
  figures_dir: reports/figures
  logs_dir: logs

# --- Train / holdout split -------------------------------------------------
# Time-based, never random. Training data runs Jan-Oct 2025 and every load we
# must predict falls in Nov-Dec, so the holdout has to sit at the end.
split:
  strategy: temporal
  train_start: "2025-01-01"
  train_end: "2025-08-31"
  holdout_start: "2025-09-01"
  holdout_end: "2025-10-31"

  # Rolling-origin folds for cross-validation. Each fold trains on everything
  # before its end date and tests on the two months that follow.
  cv_folds:
    - train_end: "2025-06-30"
      test_start: "2025-07-01"
      test_end: "2025-08-31"
    - train_end: "2025-07-31"
      test_start: "2025-08-01"
      test_end: "2025-09-30"
    - train_end: "2025-08-31"
      test_start: "2025-09-01"
      test_end: "2025-10-31"

  # Refit on all labelled data once the model is chosen.
  refit_on_full_data: true

# --- Cleaning --------------------------------------------------------------
# Thresholds and rules established in notebooks/02_data_quality.ipynb.
cleaning:
  # Negative weights are a sign flip: bounds and distribution match the valid
  # rows exactly, so abs() recovers the true value instead of losing the row.
  fix_negative_weight: true

  # Missing weight is missing at random. Median per equipment type is learned
  # on training data and reused at prediction time.
  impute_weight: true
  weight_impute_strategy: median_by_equipment

  impute_market_index: true

  # Rate-per-mile bounds for dropping corrupted targets. Roughly 1.4% of rows
  # sit far outside at ~3.5x and ~0.28x the baseline. Training only.
  drop_rate_outliers: true
  rpm_lower: 1.0
  rpm_upper: 4.0

  # Sanity bounds used for assertions, not for filtering.
  weight_min: 5000.0
  weight_max: 47500.0
  distance_min: 70.0

# --- Features --------------------------------------------------------------
features:
  # Both are weak predictors (0.18 and 0.10) and neither exists in
  # december_chart_inputs.csv. Dropping them buys one model for both files.
  use_market_index: false
  use_quote_signal: false

  # Smooth annual waves so the seasonal curve stays defined past 31 October.
  # A raw date would make tree models flatline in November and December.
  fourier_order: 3
  fourier_period: 365.25

  use_day_of_week: false
  use_coordinates: true
  use_log_distance: true

  # Falls back to coordinates when a city was never seen in training.
  # Eight such cities cover 12% of the validation set.
  categorical_encoding: ordinal_with_unknown
  unknown_category_value: -1

# --- Model -----------------------------------------------------------------
model:
  # Predict log(rate). The raw target is right-skewed (1.90) and near-symmetric
  # in logs (-0.49), so this stops long hauls dominating the error.
  target_transform: log_rate_per_mile

  seasonal_offset: false

  estimator: lightgbm
  params:
    objective: regression
    metric: rmse
    n_estimators: 1200
    learning_rate: 0.03
    num_leaves: 63
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: -1
    verbose: -1

  early_stopping_rounds: 100

# --- Evaluation ------------------------------------------------------------
evaluation:
  # Scored on dollars, not logs, so the numbers mean something to a reader.
  metrics: [rmse, mae, mape, r2]
  primary_metric: rmse

  # Median rate-per-mile by distance band. Everything else must beat this.
  run_baseline: true

# --- Submission ------------------------------------------------------------
# Hard requirements enforced by the assessment's score.py.
submission:
  id_column: load_id
  prediction_column: predicted_rate
  expected_rows: 12000
  id_prefix: TE-
  min_rate: 1.0