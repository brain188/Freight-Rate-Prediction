# The whole stack in one command.
#
#   docker compose up --build
#
#   API        http://localhost:8000/docs
#   Dashboard  http://localhost:8050
#   MLflow     http://localhost:5000
#   Postgres   localhost:5432
#
# Train a model first. Both the API and the dashboard read from models/, and
# an untrained repository gives you an API with nothing to serve:
#
#   python entrypoint/train.py

services:
  db:
    image: postgres:16-alpine
    container_name: freight-db
    environment:
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
      POSTGRES_DB: freight_monitoring
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in filename order, and only on first start when the data
      # directory is empty. Changing them later needs `docker compose down -v`.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: freight-mlflow:latest
    container_name: freight-mlflow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - mlartifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: freight-rate-api:latest
    container_name: freight-rate-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://freight:freight@db:5432/freight_monitoring
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LOG_LEVEL: INFO
    volumes:
      # Read only, so a retrain on the host is picked up with a restart rather
      # than a rebuild.
      - ./models:/app/models:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: freight-dashboard:latest
    container_name: freight-dashboard
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "8050:8050"
    environment:
      DATABASE_URL: postgresql+psycopg2://freight:freight@db:5432/freight_monitoring
      # Reached over the compose network by the dashboard itself, but the links
      # it renders are clicked in a browser on the host, so they point at
      # localhost rather than at the service name.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_UI_URL: http://localhost:5000
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models:ro
      # The training data is the drift reference, so the dashboard needs it.
      - ./data:/app/data:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8050/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts: